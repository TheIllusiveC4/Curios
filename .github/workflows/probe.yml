name: Probe 26.2 API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Materialize Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --stacktrace --no-daemon
      - name: Package locations (from patched jar class files)
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          echo "PATCHED JAR: $J"
          for C in Tuple Criterion CriterionTrigger CriterionTriggerInstance SimpleCriterionTrigger ContextAwarePredicate ItemPredicate LocationPredicate NbtPredicate MinMaxBounds EntityPredicate MultiBufferSource VertexMultiConsumer SubmitNodeCollector PoseStack; do
            echo "--- $C ---"
            unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' | grep -E "(^|/)${C}(\\\$[A-Za-z0-9_]+)?\.class$" | grep -iE 'net/minecraft|com/mojang' | sort -u | head -12
          done
      - name: Locate decompiled MC sources jar
        run: |
          echo "=== searching for MC sources jars ==="
          find /home/runner/.gradle/caches/neoformruntime /home/runner/work -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'if unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/util/Tuple\|net/minecraft/client/renderer/MultiBufferSource\|net/minecraft/advancements/Criterion"; then echo "HAS-MC: {}"; fi' 2>/dev/null | head
          echo "=== neoformruntime artifacts dir ==="
          ls -la /home/runner/.gradle/caches/neoformruntime/artifacts/ 2>/dev/null
      - name: class locations
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          for C in EntityType BlockPos Minecraft AbstractContainerScreen InventoryScreen; do
            echo "--- $C ---"
            unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' | grep -E "(^|/)${C}\.class$" | grep -iE 'net/minecraft' | sort -u | head
          done
      - name: member signatures full
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          echo "################ Minecraft: ALL Screen-typed members ################"
          javap -p -cp "$J" net.minecraft.client.Minecraft 2>&1 | grep -E "gui.screens.Screen" | head -30
      - name: find and dump vanilla sources
        run: |
          echo "=== which jar actually contains AbstractContainerScreen.JAVA ==="
          SRC=$(find /home/runner/.gradle /home/runner/work -name '*.jar' 2>/dev/null | while read j; do if unzip -l "$j" 2>/dev/null | grep -q "AbstractContainerScreen\.java"; then echo "$j"; fi; done | head -1)
          echo "SRC=$SRC"
          if [ -z "$SRC" ]; then
            echo "=== no .java jar; search decompiled output dirs ==="
            find /home/runner/.gradle/caches/neoformruntime -name 'AbstractContainerScreen.java' 2>/dev/null | head
            find /home/runner -path '*sources*' -name '*.jar' 2>/dev/null | head -20
            ACS=$(find /home/runner -name 'AbstractContainerScreen.java' 2>/dev/null | head -1); echo "ACS file: $ACS"
            MC=$(find /home/runner -name 'Minecraft.java' -path '*net/minecraft*' 2>/dev/null | head -1); echo "MC file: $MC"
            SRCFILE="$ACS"; MCFILE="$MC"; MODE=file
          else
            MODE=jar
          fi
          echo "=== ACS extractSlot / renderSlot ==="
          if [ "$MODE" = jar ]; then unzip -p "$SRC" "*/AbstractContainerScreen.java" 2>/dev/null > /tmp/acs.java || unzip -p "$SRC" "net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.java" > /tmp/acs.java 2>/dev/null; else cp "$SRCFILE" /tmp/acs.java 2>/dev/null; fi
          grep -nE "extractSlot|renderSlot|lastClickSlot|getCarried|quickCraftSlots|isQuickCrafting|snapback|CarriedItem" /tmp/acs.java | head -30
          echo "=== extractSlot method body ==="
          awk 'BEGIN{d=0;s=0} /extractSlot *\(/{s=1} s{print; n=gsub(/\{/,"{"); m=gsub(/\}/,"}"); d+=n-m; if(s&&d==0&&NR>1&&/\}/)exit}' /tmp/acs.java | head -90
          echo "=== Minecraft screen accessor ==="
          if [ "$MODE" = file ] && [ -n "$MCFILE" ]; then grep -nE "Screen screen|getScreen|public.*Screen|this.screen" "$MCFILE" | head; fi
