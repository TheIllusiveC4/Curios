name: Probe 26.2 API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Materialize Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --stacktrace --no-daemon
      - name: Package locations (from patched jar class files)
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          echo "PATCHED JAR: $J"
          for C in Tuple Criterion CriterionTrigger CriterionTriggerInstance SimpleCriterionTrigger ContextAwarePredicate ItemPredicate LocationPredicate NbtPredicate MinMaxBounds EntityPredicate MultiBufferSource VertexMultiConsumer SubmitNodeCollector PoseStack; do
            echo "--- $C ---"
            unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' | grep -E "(^|/)${C}(\\\$[A-Za-z0-9_]+)?\.class$" | grep -iE 'net/minecraft|com/mojang' | sort -u | head -12
          done
      - name: Locate decompiled MC sources jar
        run: |
          echo "=== searching for MC sources jars ==="
          find /home/runner/.gradle/caches/neoformruntime /home/runner/work -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'if unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/util/Tuple\|net/minecraft/client/renderer/MultiBufferSource\|net/minecraft/advancements/Criterion"; then echo "HAS-MC: {}"; fi' 2>/dev/null | head
          echo "=== neoformruntime artifacts dir ==="
          ls -la /home/runner/.gradle/caches/neoformruntime/artifacts/ 2>/dev/null
      - name: javap signatures
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          for FQ in net.minecraft.advancements.Criterion net.minecraft.advancements.CriterionTrigger net.minecraft.client.renderer.MultiBufferSource net.minecraft.client.renderer.SubmitNodeCollector; do
            echo "################ javap $FQ ################"
            javap -cp "$J" -public "$FQ" 2>&1 | head -40 || echo "(not found at $FQ)"
          done
