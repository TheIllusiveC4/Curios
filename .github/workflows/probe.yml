name: Probe 26.2 API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Materialize Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --stacktrace --no-daemon
      - name: Package locations (from patched jar class files)
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          echo "PATCHED JAR: $J"
          for C in Tuple Criterion CriterionTrigger CriterionTriggerInstance SimpleCriterionTrigger ContextAwarePredicate ItemPredicate LocationPredicate NbtPredicate MinMaxBounds EntityPredicate MultiBufferSource VertexMultiConsumer SubmitNodeCollector PoseStack; do
            echo "--- $C ---"
            unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' | grep -E "(^|/)${C}(\\\$[A-Za-z0-9_]+)?\.class$" | grep -iE 'net/minecraft|com/mojang' | sort -u | head -12
          done
      - name: Locate decompiled MC sources jar
        run: |
          echo "=== searching for MC sources jars ==="
          find /home/runner/.gradle/caches/neoformruntime /home/runner/work -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'if unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/util/Tuple\|net/minecraft/client/renderer/MultiBufferSource\|net/minecraft/advancements/Criterion"; then echo "HAS-MC: {}"; fi' 2>/dev/null | head
          echo "=== neoformruntime artifacts dir ==="
          ls -la /home/runner/.gradle/caches/neoformruntime/artifacts/ 2>/dev/null
      - name: class locations
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          for C in EntityType BlockPos Minecraft AbstractContainerScreen InventoryScreen; do
            echo "--- $C ---"
            unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' | grep -E "(^|/)${C}\.class$" | grep -iE 'net/minecraft' | sort -u | head
          done
      - name: member signatures full
        run: |
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | head -1)
          echo "################ Minecraft: ALL Screen-typed members ################"
          javap -p -cp "$J" net.minecraft.client.Minecraft 2>&1 | grep -E "gui.screens.Screen" | head -30
      - name: dump vanilla sources
        run: |
          SRC=/home/runner/.gradle/caches/modules-2/files-2.1/net.neoforged/neoforge/26.2.0.7-beta/1f0a5b3b48a10df044a1ee8373c2a897df0544f9/neoforge-26.2.0.7-beta-userdev.jar
          echo "=== ACS: slot-render related lines ==="
          unzip -p "$SRC" "net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.java" 2>/dev/null | grep -nE "extractSlot|renderSlot|void .*Slot\(|lastClickSlot|getCarried|isQuickCrafting|quickCraftSlots|snapback|GuiGraphicsExtractor" | head -30
          echo "=== ACS: extractSlot full (brace-balanced) ==="
          unzip -p "$SRC" "net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.java" 2>/dev/null | awk 'BEGIN{d=0;started=0} /(void|private|protected|public).*extractSlot *\(/{started=1} started{print; n=gsub(/\{/,"{"); m=gsub(/\}/,"}"); d+=n-m; if(started&&d==0&&/\}/){exit}}' | head -90
          echo "=== Minecraft.java: how to get current screen ==="
          unzip -p "$SRC" "net/minecraft/client/Minecraft.java" 2>/dev/null | grep -nE "Screen screen|getScreen|public Screen|this.screen|screenManager|ScreenManager" | head -20
